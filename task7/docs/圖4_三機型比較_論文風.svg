<text x="46" y="958" font-family="Noto Serif CJK TC" font-size="13" font-weight="bold" text-anchor="start" fill="#1a1a1a">圖 4 · 三款機型比較。</text>
<text x="164" y="958" font-family="Noto Serif CJK TC" font-size="13" font-weight="normal" text-anchor="start" fill="#1a1a1a">（甲）運算平台：D1 Max 是三台中唯一的雙高算力板；D1 MaxPro 雖是大狗，算力平台與小狗 D1 EDU 同為單顆 RK3588。</text>
<text x="46" y="978" font-family="Noto Serif CJK TC" font-size="13" font-weight="normal" text-anchor="start" fill="#1a1a1a">（乙）三台的「讀」幾乎全開，差別在「寫」——D1 EDU 與 D1 Max 的官方 SDK 只到姿態動作層，送不了關節角度或力矩；只有 D1 MaxPro 開放到單顆馬達。</text>
<text x="46" y="998" font-family="Noto Serif CJK TC" font-size="13" font-weight="normal" text-anchor="start" fill="#1a1a1a">（丙）D1 EDU 與 D1 Max 官方雖不提供，但機上存在共享記憶體介面可繞過 SDK：D1 EDU 已實機驗證三種控制模式，D1 Max 結構已解出、僅差寫入未測。</text>
<text x="46" y="1020" font-family="Noto Serif CJK TC" font-size="11.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">註：D1 MaxPro 官方文件的 SSH 帳號為 jetson，但實測主控板為 Firefly RK3588，兩者不一致，機型批次差異待向原廠確認。</text>
</svg>