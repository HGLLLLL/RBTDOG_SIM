<text x="668" y="215" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="end" fill="#6b6b6b">★ 實機驗證</text>
<text x="188" y="236" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">共享記憶體・唯讀</text>
<text x="194" y="259" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">16 軸　position / velocity / effort</text>
<text x="194" y="282" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">float32　packed struct</text>
<text x="194" y="305" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">（無溫度、無電壓）</text>
<rect x="708" y="188" width="508" height="170" rx="3" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.2"/>
<text x="722" y="215" font-family="Noto Sans Mono CJK TC" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">/dev/shm/joint_state</text>
<text x="1202" y="215" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="end" fill="#6b6b6b">★ 實機驗證</text>
<text x="722" y="236" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">共享記憶體・1 kHz・唯讀不需 root</text>
<text x="728" y="259" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">16 軸 × 5 欄位　全部 float64</text>
<text x="728" y="282" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">position  velocity  effort</text>
<text x="728" y="305" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">temp_C    voltage_V</text>
<text x="728" y="328" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">base=752  stride=120  name[64]</text>
