<text x="1256" y="215" font-family="Noto Sans Mono CJK TC" font-size="15.5" font-weight="bold" text-anchor="start" fill="#1a1a1a">OnJointStateData ／ rt/lowstate</text>
<text x="1256" y="236" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">高層 SDK 回呼 ／ ROS 1 話題</text>
