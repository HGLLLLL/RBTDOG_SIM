<text x="1262" y="282" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">        velocities / efforts</text>
<text x="1262" y="305" font-family="Noto Sans Mono CJK TC" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">（底層 SDK 須安裝 ROS 1）</text>
<text x="174" y="378" font-family="Noto Serif CJK TC" font-size="13" font-weight="normal" text-anchor="start" fill="#6b6b6b">task6 實機唯讀偵察確認可用</text>
<text x="708" y="378" font-family="Noto Serif CJK TC" font-size="13" font-weight="normal" text-anchor="start" fill="#6b6b6b">★ 每關節溫度／電壓是三台唯一　★ 實測 1 kHz</text>
