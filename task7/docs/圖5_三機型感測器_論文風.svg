<text x="46" y="1369" font-family="Noto Serif CJK TC" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">圖 5・三款機型的感測器可讀資料。</text>
<text x="46" y="1393" font-family="Noto Serif CJK TC" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">（甲）關節：三台都讀得到角度／角速度／力矩。D1 Max 是唯一附每關節溫度與電壓的，且底層 joint_state 實測更新率 1 kHz、唯讀不需 root。</text>
<text x="46" y="1417" font-family="Noto Serif CJK TC" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">（乙）IMU：三台都是 6 軸（加速度 3＋角速度 3）＋四元數。D1 EDU 底層是 float32、D1 Max 底層是 float64；D1 Max 機上其實有兩顆 IMU（運控用 ICM42688、車規級 LUA300C）。</text>
<text x="46" y="1441" font-family="Noto Serif CJK TC" font-size="14" font-weight="normal" text-anchor="start" fill="#1a1a1a">（丙）外部感測：D1 EDU 沒有光達；D1 Max 與 MaxPro 都是 96 線，但 D1 Max 是前後各一顆並附超音波與 RTK。</text>
<text x="46" y="1473" font-family="Noto Serif CJK TC" font-size="12.5" font-weight="normal" text-anchor="start" fill="#6b6b6b">註：四元數順序在 D1 EDU 與 D1 Max 上都踩過坑 —— 官方文件互相矛盾。D1 Max 目前採 xyzw，十餘趟實機旁證一致，但刻意平放的 xyzw／wxyz 對照實驗尚未執行。</text>
</svg>
