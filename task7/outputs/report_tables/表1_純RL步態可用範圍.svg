 font-size="19" fill="#000">+1.0</text><text x="847" y="527.28" text-anchor="start" font-size="19" fill="#000">+52.9°/s（92%），9 s 穩定，roll ≤ 0.7°</text><text x="1227" y="527.28" text-anchor="start" font-size="19" fill="#000">一致（模擬 98%）</text><text x="57" y="557.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">右旋轉</text><text x="167" y="557.28" text-anchor="start" font-size="19" fill="#000">−0.5 ～ −1.0 rad/s</text><text x="167" y="583.28" text-anchor="start" font-size="19" fill="#000">（−0.4 僅 39%）</text><text x="387" y="557.28" text-anchor="start" font-size="19" fill="#000">85%（0.5）、86–99%（0.8–1.0）</text><text x="717" y="557.28" text-anchor="start" font-size="19" fill="#000">−0.5</text><text x="847" y="557.28" text-anchor="start" font-size="19" fill="#000">3.5 s 後塌：右傾 4.7°，ABAD 至 0.523</text><text x="847" y="583.28" text-anchor="start" font-size="19" fill="#000">止點，平均 −7.8°/s（27%）</text><text x="1227" y="557.28" text-anchor="start" font-size="19" fill="#000">模擬邊際：側傾 1° 或摩擦 ×1.5 即</text><text x="1227" y="583.28" text-anchor="start" font-size="19" fill="#000">塌</text><text x="717" y="613.28" text-anchor="start" font-size="19" fill="#000">−1.0</text><text x="847" y="613.28" text-anchor="start" font-size="19" fill="#000">−55.4°/s（97%），9 s 穩定，roll</text><text x="847" y="639.28" text-anchor="start" font-size="19" fill="#000">2.3–2.7°</text><text x="1227" y="613.28" text-anchor="start" font-size="19" fill="#000">一致（模擬 99%）</text><line x1="48" y1="654.4" x2="1548" y2="654.4" stroke="#000" stroke-width="1.6"/><text x="48" y="678.4" font-size="16" fill="#000">達成率＝實測／指令。實機平移無里程計，以步頻與足端離地（FK）描述。護欄用量全程：ABAD 誤差峰 0.48（上限 0.77）、力矩峰 32 N·m（上限 50/70）、推論中位 1.0 ms。</text></svg>