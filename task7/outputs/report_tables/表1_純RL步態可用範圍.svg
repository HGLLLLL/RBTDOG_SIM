<svg xmlns="http://www.w3.org/2000/svg" width="1596" height="718.4" viewBox="0 0 1596 718.4" font-family="Liberation Serif, Times New Roman, Noto Serif CJK TC, Noto Serif CJK HK, Noto Serif CJK JP, serif"><rect width="1596" height="718.4" fill="#fff"/><text x="798.0" y="40" text-anchor="middle" font-size="20" fill="#000">表 1　純 RL 步態（rl16）各動作可用指令範圍與實機驗證（trip24，2026-09-30）。訓練範圍 ±1.0；模擬掃描 6 s（MuJoCo，含實機摩擦），取指令後 1 s 起平均。</text><line x1="48" y1="74" x2="1548" y2="74" stroke="#000" stroke-width="1.6"/><text x="57" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">動作</text><text x="167" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">模擬可用範圍</text><text x="387" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">模擬效果（範圍內）</text><text x="717" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">實機驗證點</text><text x="847" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">實機效果</text><text x="1227" y="103.28" text-anchor="start" font-size="19" font-weight="700" fill="#000">與模擬對照</text><line x1="48" y1="118" x2="1548" y2="118" stroke="#000" stroke-width="0.9"/><text x="57" y="143.68" text-anchor="start" font-size="19" font-weight="700" fill="#000">直走 前進</text><text x="167" y="143.68" text-anchor="start" font-size="19" fill="#000">+0.1 ～ +1.0 m/s</text><text x="387" y="143.68" text-anchor="start" font-size="19" fill="#000">純輪行；達成率 105–117%</text><text x="717" y="143.68" text-anchor="start" font-size="19" fill="#000">+0.3</text><text x="847" y="143.68" text-anchor="start" font-size="19" fill="#000">0.20 m/s（67%），輪 2.0–2.2 rad/s，腿</text><text x="847" y="169.68" text-anchor="start" font-size="19" fill="#000">不動</text><text x="1227" y="143.68" text-anchor="start" font-size="19" fill="#000">慢 30%：實機輪無摩擦補償（effort</text><text x="1227" y="169.68" text-anchor="start" font-size="19" fill="#000">恆 0）</text><text x="57" y="199.68" text-anchor="start" font-size="19" font-weight="700" fill="#000">直走 後退</text><text x="167" y="199.68" text-anchor="start" font-size="19" fill="#000">−0.1 ～ −1.0 m/s</text><text x="387" y="199.68" text-anchor="start" font-size="19" fill="#000">105–113%</text><text x="717" y="199.68" text-anchor="start" font-size="19" fill="#000">—</text><text x="847" y="199.68" text-anchor="start" font-size="19" fill="#000">未測</text><text x="1227" y="199.68" text-anchor="start" font-size="19" fill="#000">—</text><line x1="48" y1="214.8" x2="1548" y2="214.8" stroke="#000" stroke-width="0.5"/><text x="57" y="240.48000000000002" text-anchor="start" font-size="19" font-weight="700" fill="#000">左平移</text><text x="167" y="240.48000000000002" text-anchor="start" font-size="19" fill="#000">+0.35 ～ +0.8 m/s</text><text x="167" y="266.48" text-anchor="start" font-size="19" fill="#000">（≤ 0.3 不動；1.0 超</text><text x="167" y="292.48" text-anchor="start" font-size="19" fill="#000">命令速護欄）</text><text x="387" y="240.48000000000002" text-anchor="start" font-size="19" fill="#000">踏步 1.4–2.0 步/s，抬 10–33 mm；</text><text x="387" y="266.48" text-anchor="start" font-size="19" fill="#000">達成率 38%（0.35）→ 90%（0.8）</text><text x="717" y="240.48000000000002" text-anchor="start" font-size="19" fill="#000">+0.3</text><text x="847" y="240.48000000000002" text-anchor="start" font-size="19" fill="#000">不動</text><text x="1227" y="240.48000000000002" text-anchor="start" font-size="19" fill="#000">死區與模擬一致</text><text x="717" y="270.48" text-anchor="start" font-size="19" fill="#000">+0.5</text><text x="847" y="270.48" text-anchor="start" font-size="19" fill="#000">踏步 1.1–1.2 步/s，抬 12–29 mm，roll</text><text x="847" y="296.48" text-anchor="start" font-size="19" fill="#000">峰 2.4°，自轉偏移 −4°/s</text><text x="1227" y="270.48" text-anchor="start" font-size="19" fill="#000">有踏步，與模擬一致。實機 vs 模擬：</text><text x="1227" y="296.48" text-anchor="start" font-size="19" fill="#000">步頻 1.1–1.2 vs 1.8 步/s；抬腳</text><text x="1227" y="322.48" text-anchor="start" font-size="19" fi